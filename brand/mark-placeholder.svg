<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ligga Fritt (platshållarmärke)">
  <title>Ligga Fritt — placeholder</title>

  <!-- PLACEHOLDER. Swap for the real mark when the artwork lands; see
       brand/README.md. Drawn in the CP-Tjänst palette and deliberately plain,
       so it reads as a stand-in rather than as a finished brand. -->

  <defs>
    <!-- The transparency checker, which is what this tool produces. -->
    <pattern id="lf-checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#FCF4EC"/>
      <rect width="16" height="16" fill="#F4EBE2"/>
      <rect x="16" y="16" width="16" height="16" fill="#F4EBE2"/>
    </pattern>
    <!-- The cut-out itself: a shoulders-up portrait silhouette. -->
    <clipPath id="lf-bust">
      <path d="M256 118c39 0 68 31 68 71 0 26-9 47-22 61 4 10 11 17 22 21l58 22c31 12 50 41 50 74v27H80v-27c0-33 19-62 50-74l58-22c11-4 18-11 22-21-13-14-22-35-22-61 0-40 29-71 68-71Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#lf-checker)"/>

  <!-- The figure stands free of the ground behind it — the product in one image. -->
  <g clip-path="url(#lf-bust)">
    <rect width="512" height="512" fill="#0D4C80"/>
    <rect y="300" width="512" height="212" fill="#144166"/>
  </g>

  <!-- A dashed edge, the cut line. -->
  <path d="M256 118c39 0 68 31 68 71 0 26-9 47-22 61 4 10 11 17 22 21l58 22c31 12 50 41 50 74v27H80v-27c0-33 19-62 50-74l58-22c11-4 18-11 22-21-13-14-22-35-22-61 0-40 29-71 68-71Z"
        fill="none" stroke="#FCB633" stroke-width="10" stroke-linejoin="round" stroke-dasharray="26 18"/>
</svg>
